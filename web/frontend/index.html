<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anki Occlusion - Dojo Dashboard</title>
    <!-- ONNX Runtime Web for zero-cost client-side math OCR prediction -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <!-- Dojo Premium Theme Assets from Home.html -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Roboto+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dojo-dark': '#0f150e',
                        'dojo-panel': '#181d16',
                        'dojo-card': '#353b33',
                        'dojo-accent-green': '#45a247',
                        'dojo-neon-green': '#66fcf1',
                        'dojo-text': '#c5c6c7',
                        'dojo-red': '#ff4d4d',
                        'dojo-purple': '#b088f9',
                        'dojo-border': '#2d332b'
                    },
                    fontFamily: {
                        'dojo-display': ['"Press Start 2P"', 'cursive'],
                        'dojo-mono': ['"Roboto Mono"', 'monospace'],
                    },
                    animation: {
                        'scanline': 'scanline 8s linear infinite',
                        'flicker-in': 'flickerIn 0.5s ease-out forwards',
                        'arcade-pulse': 'arcadePulse 1.5s infinite',
                        'flicker-slow': 'flicker 3s infinite',
                        'flicker-fast': 'flicker 0.15s infinite',
                        'pixel-slide': 'pixelSlide 0.2s steps(4) forwards'
                    },
                    keyframes: {
                        scanline: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100vh)' }
                        },
                        flickerIn: {
                            '0%': { opacity: '0' },
                            '20%': { opacity: '1' },
                            '40%': { opacity: '0' },
                            '60%': { opacity: '1' },
                            '80%': { opacity: '0.5' },
                            '100%': { opacity: '1' }
                        },
                        arcadePulse: {
                            '0%, 100%': { opacity: '1', transform: 'scale(1)' },
                            '50%': { opacity: '0.8', transform: 'scale(0.98)' }
                        },
                        flicker: {
                            '0%, 19%, 21%, 23%, 25%, 54%, 56%, 100%': {
                                opacity: '1',
                            },
                            '20%, 24%, 55%': {
                                opacity: '0.8',
                            }
                        },
                        pixelSlide: {
                            '0%': { transform: 'translateX(20px)', opacity: '0' },
                            '50%': { transform: 'translateX(-5px)', opacity: '0.5' },
                            '100%': { transform: 'translateX(0)', opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .text-shadow-neon {
            text-shadow: 0 0 5px rgba(102, 252, 241, 0.5);
        }

        .panel-border {
            border: 1px solid #2d332b;
            border-radius: 4px;
        }

        .btn-green-glow {
            box-shadow: 0 0 10px rgba(69, 162, 71, 0.3);
            transition: all 0.2s ease-in-out;
        }

        .btn-green-glow:hover {
            box-shadow: 0 0 15px rgba(69, 162, 71, 0.8);
            transform: translateY(-2px);
        }

        .btn-purple-glow:hover {
            box-shadow: 0 0 15px rgba(176, 136, 249, 0.8);
        }

        .btn-cyan-glow:hover {
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.8);
        }

        .scanlines-overlay {
            background: linear-gradient(to bottom,
                    rgba(255, 255, 255, 0),
                    rgba(255, 255, 255, 0) 50%,
                    rgba(0, 0, 0, 0.2) 50%,
                    rgba(0, 0, 0, 0.2));
            background-size: 100% 4px;
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 100;
            opacity: 0.3;
        }

        @keyframes logoGlitch {
            0%, 100% {
                transform: translate(0);
                opacity: 1;
            }
            10% {
                transform: translate(-2px, -1px);
                opacity: 0.8;
            }
            20% {
                transform: translate(2px, 1px);
                opacity: 0.9;
            }
            30% {
                transform: translate(-1px, 2px);
                opacity: 0.7;
            }
            40% {
                transform: translate(1px, -2px);
                opacity: 1;
            }
            50% {
                transform: scale(1.02);
                filter: blur(0.5px);
            }
        }

        .animate-logo-glitch {
            animation: logoGlitch 0.2s infinite;
        }

        @keyframes intenseFlicker {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% {
                opacity: 1;
            }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% {
                opacity: 0.3;
            }
        }

        .animate-intense-flicker {
            animation: intenseFlicker 2s infinite;
        }

        @keyframes glitch {
            0% {
                clip-path: inset(80% 0 0 0);
                transform: translate(-5px, -2px);
                text-shadow: 2px 0 #ff4d4d, -2px 0 #66fcf1;
            }
            10% {
                clip-path: inset(10% 0 85% 0);
                transform: translate(5px, 2px);
            }
            20% {
                clip-path: inset(40% 0 43% 0);
                transform: translate(-5px, 0);
                text-shadow: -2px 0 #ff4d4d, 2px 0 #66fcf1;
            }
            30% {
                clip-path: inset(0% 0 0% 0);
                transform: translate(0);
            }
            40% {
                clip-path: inset(80% 0 0 0);
                transform: translate(5px, 2px);
                text-shadow: 2px 0 #ff4d4d, -2px 0 #66fcf1;
            }
            50% {
                clip-path: inset(10% 0 85% 0);
                transform: translate(-5px, -2px);
            }
            60% {
                clip-path: inset(40% 0 43% 0);
                transform: translate(5px, 0);
                text-shadow: -2px 0 #ff4d4d, 2px 0 #66fcf1;
            }
            70% {
                clip-path: inset(0% 0 0% 0);
                transform: translate(0);
            }
            100% {
                clip-path: inset(0% 0 0% 0);
                transform: translate(0);
            }
        }

        .glitch-active {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
        }

        @keyframes crtGhosting {
            0% {
                transform: translate(0);
                text-shadow: 0 0 5px rgba(102, 252, 241, 0.5);
            }
            10% {
                transform: translate(-4px, 1px);
                text-shadow: 4px 0 rgba(255, 77, 77, 0.7), -4px 0 rgba(102, 252, 241, 0.7);
                opacity: 0.8;
            }
            20% {
                transform: translate(4px, -1px);
                text-shadow: -4px 0 rgba(255, 77, 77, 0.7), 4px 0 rgba(102, 252, 241, 0.7);
                opacity: 0.9;
            }
            30% {
                transform: translate(-2px, 0);
                text-shadow: 2px 0 rgba(176, 136, 249, 0.8);
                opacity: 0.7;
            }
            40% {
                transform: translate(0);
                text-shadow: 0 0 5px rgba(102, 252, 241, 0.5);
                opacity: 1;
            }
            100% {
                transform: translate(0);
            }
        }

        .crt-ghosting-active {
            position: relative;
            animation: crtGhosting 0.25s infinite !important;
        }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
